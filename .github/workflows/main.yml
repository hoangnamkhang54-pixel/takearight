name: Build OCBoost deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tim va chep project sang thu muc sach
        run: |
          CTRL=$(find . -maxdepth 5 -name control -not -path './.git/*' -not -path '*/layout/*' | head -n1)
          if [ -z "$CTRL" ]; then
            echo "Khong thay file control. Cac file trong repo:"
            find . -maxdepth 5 -not -path './.git/*'
            exit 1
          fi
          SRC=$(dirname "$CTRL")
          echo "Project nam o: $SRC"
          mkdir -p "$HOME/proj"
          cp -R "$SRC"/. "$HOME/proj/"
          echo "PROJECT_DIR=$HOME/proj" >> "$GITHUB_ENV"
          ls -la "$HOME/proj"

      - name: Cai cong cu
        run: brew install ldid dpkg make

      - name: Cai Theos va SDK
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          cp -R "$HOME"/theos-sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gmake package FINALPACKAGE=1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp packages/*.deb "$GITHUB_WORKSPACE/out/"

      - name: Tai file deb
        uses: actions/upload-artifact@v4
        with:
          name: OCBoost-deb
          path: out/*.deb
          if-no-files-found: error
