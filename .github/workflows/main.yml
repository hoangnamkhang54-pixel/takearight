name: Build OCBoost deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tim thu muc project
        run: |
          CTRL=$(find . -maxdepth 2 -name control -not -path './.git/*' | head -n1)
          if [ -z "$CTRL" ]; then
            echo "Khong thay file control. Cac file trong repo:"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          DIR=$(dirname "$CTRL")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project nam o: $DIR"
          ls -la "$DIR"

      - name: Cai cong cu
        run: brew install ldid dpkg make

      - name: Cai Theos va SDK
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          cp -R "$HOME"/theos-sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gmake package FINALPACKAGE=1

      - name: Tai file deb
        uses: actions/upload-artifact@v4
        with:
          name: OCBoost-deb
          path: ${{ env.PROJECT_DIR }}/packages/*.deb
          if-no-files-found: error
