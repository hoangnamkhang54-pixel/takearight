name: Build OCBoost deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai cong cu
        run: brew install ldid dpkg make

      - name: Cai Theos va SDK
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          cp -R "$HOME"/theos-sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: gmake package FINALPACKAGE=1

      - name: Tai file deb
        uses: actions/upload-artifact@v4
        with:
          name: OCBoost-deb
          path: packages/*.deb
